<svg xmlns="http://www.w3.org/2000/svg" width="80" height="96" viewBox="0 0 80 96" fill="none">
  <defs>
    <linearGradient id="plate" x1="9" y1="10" x2="71" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0f1f1"/><stop offset=".24" stop-color="#d4d7d8"/><stop offset=".52" stop-color="#b9bec1"/><stop offset=".76" stop-color="#d1d4d5"/><stop offset="1" stop-color="#a4aaae"/>
    </linearGradient>
    <linearGradient id="edge" x1="6" y1="0" x2="74" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#657079"/><stop offset=".08" stop-color="#e7ebed"/><stop offset=".15" stop-color="#7b858d"/><stop offset=".82" stop-color="#bac2c7"/><stop offset=".94" stop-color="#f7f9fa"/><stop offset="1" stop-color="#646f78"/>
    </linearGradient>
    <linearGradient id="tab" x1="17" y1="44" x2="61" y2="86" gradientUnits="userSpaceOnUse">
